<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --text-color:red;
            --bg-color:black;
            --border-color:white;
            --text-size:18px;
            --head-size:35px;
        }
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        section{
            width: 100%;
            height: 100vh;
        }
        header{
            background-color: var(--bg-color);
            width: 100%;
            height: 72px;
        }
        h1{
            color: var(--text-color);
            text-align: center;
            font-size: var(--head-size);
        }
        p{
            color: var(--text-color);
            font-size: var(--text-size);
            text-align: center;
        }
        main{
            width: 100%;
            height: calc(100vh - 622px);
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: var(--text-size);
        }

    </style>
</head>

<body>
    <section>
        <header>
            <h1>
                Top Heading of the Document
            </h1>
        </header>
        <main>
            <img src="" alt="">
        </main>
        <footer>
            <p>@Copyright 2025. All Rights Reserved to Owner!</p>
        </footer>
    </section>
</body>

</html>
