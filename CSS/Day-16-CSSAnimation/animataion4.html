<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        h1{
            text-align: center;
            margin: 20px;
        }
        .orbit{
            width: 100%;
            height: 600px;
            border: 1px solid;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .earth{
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background-image: url(https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/The_Blue_Marble%2C_AS17-148-22727.jpg/1200px-The_Blue_Marble%2C_AS17-148-22727.jpg);
            background-repeat: no-repeat;
            background-size: 114%;
            background-position: center;
            position: absolute;
            animation: moon-orbit 5s linear infinite;
        }
        .moon{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-image: url(https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/FullMoon2010.jpg/500px-FullMoon2010.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: 140%;
            transform: translate(52px,20px);
            animation: moon-orbit 5s linear infinite;
        }
        .moon-orbit{
            width: 600px;
            height: 600px;
            border-radius: 50%;
             animation: moon-orbit 5s linear infinite;
        }
        @keyframes moon-orbit {
            from{
                transform: rotate(0deg);

            }to{
                transform: rotate(360deg);
            }
            
        }

    </style>
</head>
<body>
    <h1>Earth with Moon Roataing Demo by Using Animation</h1>
    <div class="orbit">
        <div class="earth"></div>
        <div class="moon-orbit">
            <div class="moon"></div>
        </div>
    </div>
</body>
</html>
