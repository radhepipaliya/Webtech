<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select option</title>
</head>
<body>
        <h1>Dropdown list by using &lt;select&gt; tag.</h1>
        <form action="">
            <label for="">Select your course:</label>
            <select name="course" size="2" id="" multiple>
                <option value="" disabled selected>-----Select your course-----</option>
                <optgroup label="Full Stack course">
                    <option value="Java Full Stack">Java Full stack</option>
                    <option value="Python Full Stack">Python Full stack</option>
                </optgroup>
                <optgroup label="Testing courses">
                    <option value="">Software testing </option>
                </optgroup>
                <option value="">Data Analysis + Data Science</option>
            </select>
            <button>submit</button>
        </form>
</body>
</html>
