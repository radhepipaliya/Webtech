<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        .grid-parent{
            width: 100%;
            border: 3px solid red;
            display: grid;
            /* grid-template-columns: 100px 200px 300px;
            grid-template-columns: 10% 20% 30%;
            grid-template-columns: auto auto auto; */
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: 100px 300px 50px;
            column-gap: 20px;
            row-gap: 15px;
            gap: 10px 30px;
            gap: 10px;
            
        }
        .grid-item{
            /* padding: 20px; */
            border: 2px solid;
            display: flex;
            justify-content: center;
            align-items: center;

        }
    </style>
</head>
<body>
    <div class="grid-parent">
        <div class="grid-item">Grid-Iteam-1</div>
        <div class="grid-item">Grid-Iteam-2</div>
        <div class="grid-item">Grid-Iteam-3</div>
        <div class="grid-item">Grid-Iteam-4</div>
        <div class="grid-item">Grid-Iteam-5</div>
        <div class="grid-item">Grid-Iteam-6</div>
        <div class="grid-item">Grid-Iteam-7</div>
        <div class="grid-item">Grid-Iteam-8</div>
        <div class="grid-item">Grid-Iteam-9</div>
        <div class="grid-item">Grid-Iteam-10</div>
    </div>  
</body>
</html>
