<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        .grid-parent{
            width: 100%;
            height: 100vh;
            border: 3px solid red;
            display: grid;
            grid-template-columns: repeat(4,auto);

           gap: 10px;
        }
        .grid-item{
            /* padding: 20px; */
            border: 2px solid;
            display: flex;
            justify-content: center;
            align-items: center;

        }
    </style>
</head>

        <div class="grid-item">Grid-Iteam-14</div>
        <div class="grid-item">Grid-Iteam-15</div>

</html>
