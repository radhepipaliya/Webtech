<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        .parent{
            width: 100%;
            height: 100vh;
            background-color: black;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(3,1fr);
            gap: 10px;
            padding: 10px;
        }

        .grid-item{
            padding: 25px;
            /* width: 100px; */
            background-color: beige;
            border: 1px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #grid-item1{
           justify-self: stretch;
           
        }
        #grid-item2{
           justify-self: center;
           align-self: start;
        }
        #grid-item3{
            grid-column-start: 2;
            grid-column-end: 3;
            justify-self:start;
        }
        #grid-item4{
            justify-self: end;
        }

        #grid-item5{
            justify-self: end;
            grid-column-start: 2;
            grid-column-end: 3;
            justify-self: center;
            align-self: center;
        }
        #grid-item6{
            grid-column-start: 3;
            grid-column-end: 4;
            justify-self: center;
            align-self: end;
        }
       
    </style>
</head>
<body>
        <div class="parent">
            <div class="grid-item" id="grid-item1">Stretch</div>
            <div class="grid-item" id="grid-item2">start</div>
            <div class="grid-item" id="grid-item3">Justify-Self:(start)</div>
            <div class="grid-item" id="grid-item4">end</div>
            <div class="grid-item" id="grid-item5">Center</div>
            <div class="grid-item" id="grid-item6">end</div>
        </div>
</body>
</html>
