<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
            .box{
                width: 600px;
                height: 250px;
                border: 1px solid gray;
                margin: 50px auto;
            }
            h1{
                text-align: center;
            }
            #box1{
                background-image:
                linear-gradient(to bottom,red,blue);
            }
            #box2{
                background-image: linear-gradient(to right,red,yellow,green);
            }
            #box3{
                background-image: linear-gradient(to bottom right, red,blue,yellow);
            }
            #box31{
                background-image: linear-gradient(to bottom left, yellow,blue,red);
            }
            #box4{
                background-image: repeating-linear-gradient(red 10%,blue 20%,yellow 30%);
            }
            #box5{
                background-image: linear-gradient(orange,white,green);
            }
            #box6{
                background-image: linear-gradient(orange 0% 33%,white 34% 66%,green 66%);
                border-radius: 50px;
            }    
    </style>
</head>
<body>
        <h>1.Linear gradient </h>
        <div class="box" id="box1">box-1</div>
        <div class="box" id="box2">box-2</div>
        <div class="box" id="box3">box-3</div>
        <div class="box" id="box31">box-3</div>
        <div class="box" id="box4">box-4</div>
        <div class="box" id="box5">box-5</div>
        <div class="box" id="box6">box-6</div>


</body>
</html>
