<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        .parent{
            width: 100%;
            height: 100vh;
            background-color: black;
            display: grid;
            padding: 10px;
            grid-template-areas: "head head head"
                                "side sec sec"
                                "side main main"
                                "foot foot foot";
        }
        .grid-item{
            background-color: wheat;
            padding: 20px;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            border-radius: 10px;
        }
        #grid-item1{
            grid-area: head;
        }
        #grid-item2{
            grid-area: side;
        }
        #grid-item3{
            grid-area: sec;
        }
        #grid-item4{
            grid-area: main;
        }
        #grid-item5{
            grid-area: foot;
        }

        
    </style>
</head>
<body>
    <div class="parent">
        <div class="grid-item" id="grid-item1">Header</div>
        <div class="grid-item" id="grid-item2">Aside</div>
        <div class="grid-item" id="grid-item3">Section</div>
        <div class="grid-item" id="grid-item4">Main</div>
        <div class="grid-item" id="grid-item5">Footer</div>
    </div>
</body>
</html>
