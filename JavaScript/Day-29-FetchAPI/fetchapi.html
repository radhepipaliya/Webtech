<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
  :root {
    --primary-color: #4f46e5;
    --text-main: #1f2937;
    --text-sub: #6b7280;
    --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }

  #container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 400px;
    background: #f3f4f6;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .user-card {
    background: white;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    width: 300px;
    transition: transform 0.3s ease;
    border: 1px solid #e5e7eb;
  }

  .user-card:hover {
    transform: translateY(-5px);
  }

  .user-id {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--primary-color);
    margin-bottom: 0.5rem;
    font-weight: 700;
  }

  .user-name {
    font-size: 1.5rem;
    color: var(--text-main);
    margin: 0 0 0.25rem 0;
    font-weight: 600;
  }

  .user-role {
    font-size: 0.9rem;
    color: var(--text-sub);
    margin: 0;
    display: flex;
    align-items: center;
  }

  /* Adding a small decorative accent */
  .user-card::before {
    content: '';
    display: block;
    width: 40px;
    height: 4px;
    background: var(--primary-color);
    border-radius: 2px;
    margin-bottom: 1.5rem;
  }
</style>
</head>
<body>
    <div id="container">

    </div>
    <script src="./fetchapi.js"></script>
</body>
</html>
