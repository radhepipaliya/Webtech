<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .parent {
            width: 100%;
            height: 100vh;
            background-color: black;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            padding: 10px;
        }

        .grid-item {
            padding: 25px;
            /* width: 100px; */
            background-color: beige;
            /* border: 1px solid white; */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #grid-item1 {
            justify-self: stretch;
            grid-row: 1/3;
            background-image: url(../../asset/heron-9440691_1280.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;

        }

        #grid-item2 {
            grid-column: 2/4;
            background-image: url(../../asset/deer-9891816_1280.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;

        }

        #grid-item3 {
            grid-column: 4;
            grid-row: 1/3;
            background-image: url(../../asset/kitten-9920257_1280.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        #grid-item4 {
            grid-column: 2/4;
            background-color: #000;
            font-size: 70px;
            color: white;
            letter-spacing: 60px;
        }

        #grid-item5 {
            grid-row: 3;
            grid-column: 1/3;
            background-image: url(../../asset/elk-7587415_1280.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        #grid-item6 {
            grid-row: 3;
            grid-column: 3/5;
            display: flex;
            flex-direction: column;
            align-items:start ;
            font-size: 30px;
            color: white;
            background-color: #000;
        }

        #grid-item6 span{
            color: blue;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="grid-item" id="grid-item1"></div>
        <div class="grid-item" id="grid-item2"></div>
        <div class="grid-item" id="grid-item3"></div>
        <div class="grid-item" id="grid-item4">
            <h1>Result</h1>
        </div>
        <div class="grid-item" id="grid-item5"></div>
        <div class="grid-item" id="grid-item6">
            <h3><span>#</span>Task 4</h3>
            <br>
            <p>Responsive image Gallery Using <br>Css Grid</p>
        </div>
    </div>
</body>

</html>
