<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        .parent{
            width: 100%;
            height: 100vh;
            display: grid;
            background-color: black;
            padding: 10px;
            grid-template-areas: "head head head head"
                                "left-1 left-1  right-1 right-1"
                                "sec sec sec sec"
                                "left-2 left-2 right-2 right-2"
                                "foot foot foot foot";
        }
        .grid-items{
            background-color: wheat;
            padding: 20px;
            border:1px solid black;
            justify-content: center;
            border-radius: 10px;
            display: flex;
            align-items: center;
            font-size: 36px;
        }
        #grid-item1{
            grid-area: head;
        }
        #grid-item2{
            grid-area: left-1;
        }
        #grid-item3{
            grid-area: right-1;
        }
        #grid-item4{
            grid-area: sec;
        }
        #grid-item5{
            grid-area: left-2;
        }
        #grid-item6{
            grid-area: right-2;
        }

        #grid-item7{
            grid-area: foot;
        }
    </style>
</head>
<body>
    <div class="parent">
       <div class="grid-items" id="grid-item1">Header</div>
       <div class="grid-items" id="grid-item2">Left-1</div>
       <div class="grid-items" id="grid-item3">Right-1</div>
       <div class="grid-items" id="grid-item4">Section</div>
       <div class="grid-items" id="grid-item5">Left-2</div>
       <div class="grid-items" id="grid-item6">Right-2</div>
       <div class="grid-items" id="grid-item7">Footer</div>
    </div>
</body>
</html>
