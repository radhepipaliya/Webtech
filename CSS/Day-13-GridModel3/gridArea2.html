<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        .parent{
            width: 100%;
            height: 100vh;
            display: grid;
            padding: 10px;
            grid-template-areas: "head head head head"
                                "aside-1 aside-1 aside-2 aside-2"
                                "sec sec sec sec"
                                "main main main main"
                                "foot foot foot foot";
        }
        .grid-items{
            background-color: wheat;
            padding: 20px;
            border:1px solid black;
            justify-content: center;
            border-radius: 10px;
            display: flex;
            align-items: center;
            font-size: 36px;
        }
        #grid-item1{
            grid-area: head;
        }
        #grid-item2{
            grid-area: aside-1;
        }
        #grid-item3{
            grid-area: aside-2;
        }
        #grid-item4{
            grid-area: sec;
        }
        #grid-item5{
            grid-area: main;
        }
        #grid-item6{
            grid-area: foot;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="grid-items" id="grid-item1">Header</div>
        <div class="grid-items" id="grid-item2">Aside-1</div>
        <div class="grid-items" id="grid-item3">Aside-2</div>
        <div class="grid-items" id="grid-item4">Section</div>
        <div class="grid-items" id="grid-item5">Main</div>
        <div class="grid-items" id="grid-item6">Footer</div>
    </div>
</body>
</html>
