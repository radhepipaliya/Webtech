<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form</title>
</head>
<body>
        <form action="">
            <fieldset>
                <legend><h1>Registartion form</h1></legend>
                <table>
                    <tr>
                        <td><label for="">Name:</label></td>
                        <td><input type="text" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">Email:</label></td>
                        <td><input type="email" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">Password:</label></td>
                        <td><input type="password" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">gender</label></td>
                        <td><input type="radio" name="gender" id="">Male</td>
                        <td><input type="radio" name="gender" id="">Female</td>
                    </tr>
                    <tr>
                        <td><label for="">Course</label></td>
                        <td><input type="checkbox" name="" id="">HTML</td>
                        <td><input type="checkbox" name="" id="">CSS</td>
                        <td><input type="checkbox">Javascript</td>

                    </tr>
                    <tr>
                        <td><label for="">select price</label></td>
                        <td><input type="range" id="" step="20"></td>
                    </tr>
                    <tr>
                        <td><label for="">file</label></td>
                        <td><input type="file"></td>
                    </tr>
                    <tr>
                        <td><label for="">Image</label></td>
                        <td><input type="image" src="../asset/girl.jpg" width="100px"></td>
                    </tr>
                    <tr>
                        <td><label for="">Select Color:</label></td>
                        <td><input type="color"></td>
                    </tr>
                    <tr>
                        <td><label for=""></label></td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td><label for="">month</label></td>
                        <td><input type="month"></td>
                    </tr>
                    <tr>
                        <td><label for="">week</label></td>
                        <td><input type="week"></td>
                    </tr>
                    <tr>
                        <td><label for="">number</label></td>
                        <td><input type="number"></td>
                    </tr>
                    <tr>
                        <td><label for="">date</label></td>
                        <td><input type="date"></td>
                    </tr>
                    <tr>
                        <td><label for="">datetime-local</label></td>
                        <td><input type="datetime-local"></td>
                    </tr>
                    <tr>
                        <td><label for="">datetime</label></td>
                        <td><input type="datetime"></td>
                    </tr>
                    <tr>
                        <td><label for="">Enter your Github</label></td>
                        <td><input type="url"></td>
                    </tr>
                    <tr>
                        <td><label for="">telphone no</label></td>
                        <td><input type="tel"></td>
                    </tr>
                    <tr>
                        <td><label for="">Search</label></td>
                        <td><input type="search"></td>
                    </tr>
                    <tr>
                        <td><label for="">Address</label></td>
                        <td><textarea name="" id="" cols="40"></textarea></td>
                    </tr>
                    <tr>
                        <td><input type="hidden" name="Sensitive" value="NUll"></td>
                    </tr>
                    <tr>
                        <td><input type="submit" name="" id=""></td>
                        <td><input type="reset" value="reset"></td>
                    </tr>
                </table>
            </fieldset>
        </form>
</body>
</html>
