<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
      }
      .box {
        width: 200px;
        height: 200px;
      }
      #box1 {
        background-color: red;
      }
      #box2 {
        background-color: rgb(50, 200, 30);
      }
      #box3 {
        background-color: rgb(255, 255, 255);
      }
      #box4 {
        background-color: rgb(0, 0, 0);
      }
      #box5 {
        background-color: rgb(0, 0, 255);
      }
      #box6 {
        background-color: rgba(255, 0, 0, 0.425);
      }
      #box8 {
        background-color: #00ff00;
      }
      #box9 {
        background-color: hsl(228, 28%, 37%);
      }
    </style>
  </head>
  <body>
    <h1>Colors in CSS</h1>
    <div class="box" id="box1">1</div>
    <div class="box" id="box2">2</div>
    <div class="box" id="box3">3</div>
    <div class="box" id="box4">4</div>
    <div class="box" id="box5">5</div>
    <div class="box" id="box6">6</div>
    <div class="box" id="box7">7</div>
    <div class="box" id="box8">8</div>
    <div class="box" id="box9">9</div>
  </body>
</html>
