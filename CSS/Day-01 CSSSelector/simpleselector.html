<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: black;
        }
        #para1{
            border: 3px solid green;
        }
        .color-group{
            background-color: salmon;
        }
        *{
            border: 3px solid red;
            background-color: yellow;
        }

        h1{
            color: black;
            background-color: white;
        }
    </style>
</head>
<body>
    <p id="para1">
        This is paragraph-1
    </p>
    <p class="color-group">This is paragraph-2</p>
    <h2 class="color-group">heading-2</h2>
    <h1>This is heading-1</h1>
</body>
</html>
